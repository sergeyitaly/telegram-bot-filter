[pytest]
asyncio_mode = auto
# Without this, `bot` (repo root, alongside tests/) is only importable when
# pytest is invoked as `python -m pytest` (which adds cwd to sys.path) --
# bare `pytest` does not, and every doc/hook/CI step in this repo uses the
# bare form. Explicit pythonpath makes both invocation styles work the same.
pythonpath = .
